<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You - SARMAK Registration</title>
    <style>
      body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; background: radial-gradient(ellipse at top, rgba(59,76,190,0.2), transparent 45%), linear-gradient(180deg, #11112d, #09091a); color: #f7f7f7; display: flex; align-items: center; justify-content: center; }
      .container { max-width: 700px; margin: 24px; padding: 40px; text-align: center; border: 1px solid rgba(255,255,255,0.1); border-radius: 28px; background: rgba(27,27,67,0.8); backdrop-filter: blur(20px); }
      .logo { display: block; width: min(100%, 380px); height: auto; margin: 0 auto 18px; }
      .tagline { margin: 0 0 28px; color: #f5a044; letter-spacing: 0.04em; }
      .button { margin-top: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 16px 28px; border-radius: 999px; background: linear-gradient(90deg, #f5a044, #ffbd68); color: #11112d; font-weight: 700; text-decoration: none; }
      .label { display: inline-block; margin-bottom: 16px; padding: 10px 14px; background: rgba(245,160,68,0.15); color: #f5a044; text-transform: uppercase; letter-spacing: 0.28em; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="container">
      <img class="logo" src="/sarmak-learning-logo.jpg" alt="SARMAK logo" />
      <p class="tagline">Learn what industry needs</p>
      <span class="label">Registration Received</span>
      <h1>Thank you for registering!</h1>
      <p style="color: rgba(255,255,255,0.72); font-size: 1.05rem; line-height: 1.8; margin-top: 16px;">
        Your registration request has been submitted. We will contact you soon with the next batch details and onboarding information.
      </p>
      <a class="button" href="/">
        Back to SARMAK Learning Portal
      </a>
    </div>
  </body>
</html>
